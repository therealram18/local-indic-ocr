[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-doc-parser"
version = "0.1.0"
description = "Modular block-level Indic document parser (layout + reading order + per-block OCR)"
readme = "README.md"
requires-python = ">=3.11"
# `pip install indic-doc-parser` pulls these. vLLM's default PyPI wheel works on most CUDA drivers;
# if yours needs a specific CUDA line (e.g. cu129), build the env with envs/setup_inference_env.sh
# (which pulls matching wheels) — same pattern Surya uses with its Docker image. Verified stack:
# vllm 0.26.1 + torch 2.13.0+cu129 + transformers 5.14.1.
dependencies = [
    "vllm>=0.26",
    "transformers>=5.7",
    "scipy",
    "ninja",
    "pillow>=12",
    "numpy>=2",
    "huggingface-hub>=1.0",
    "hf_xet",
    "accelerate",
]

[project.scripts]
indic-doc-parser = "indic_doc_parser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["indic_doc_parser*"]
